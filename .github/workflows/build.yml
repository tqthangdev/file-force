name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Uploading 400 MB of artifacts on every push would burn the storage quota, so the
# packages are only uploaded for a tag or a manual run. The build itself still runs on
# every push so a broken build is caught early.
jobs:
  # Linux only: the external-tool tests drive stand-in ffmpeg/soffice executables,
  # which are POSIX scripts (shebang + chmod), so they cannot run on Windows.
  # Windows is covered by the build job below, which produces the .exe.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyQt6 bundles Qt itself, but the offscreen platform plugin still needs
      # libegl / libgl on a bare Linux runner.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      # Installs PyInstaller too, so build.py does not need to (and never installs
      # into a system Python).
      - name: Install build dependencies
        run: pip install -e ".[build]"

      - name: Build
        run: python build.py

      # The icons are resolved relative to the app package, so they must keep the
      # same path inside the bundle.
      - name: Verify build output
        shell: bash
        run: |
          test -f dist/FileForge/_internal/app/assets/icons/question.svg
          test -f dist/FileForge/_internal/app/assets/icons/fileforge.ico
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/FileForge/FileForge.exe
          else
            test -x dist/FileForge/FileForge
          fi

      # Proves the packaged bundle actually starts (exit 124 = still running).
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 10 ./dist/FileForge/FileForge || test $? -eq 124

      # Packaged with the `zip` CLI (not by upload-artifact), which stores Unix file
      # modes, so the executable bit survives extraction on Linux.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../FileForge-linux.zip FileForge
          cd ..
          ls -lh FileForge-linux.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\FileForge" -DestinationPath "FileForge-windows.zip" -Force
          Get-Item "FileForge-windows.zip"

      - name: Upload package (Linux)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          path: FileForge-linux.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload package (Windows)
        if: >-
          runner.os == 'Windows' &&
          (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          path: FileForge-windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the release notes are built from the commit log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: FileForge-linux.zip
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: FileForge-windows.zip
          path: release

      - name: Verify release files
        run: |
          ls -lh release
          test -f release/FileForge-linux.zip
          test -f release/FileForge-windows.zip

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${tag}"
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' "${range}" 2>/dev/null || true
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/FileForge-linux.zip
            release/FileForge-windows.zip
          body_path: release-notes.md
