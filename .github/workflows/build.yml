name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v7

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e

          pip install -e ".[build]"
          python build.py

          test -f dist/FileForge/FileForge
          test -f dist/FileForge/_internal/version.json

          echo "=== Linux build ==="
          ls -lah dist/FileForge

          echo "=== Build size ==="
          du -sh dist/FileForge

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install -e ".[build]"
          python build.py

          if (!(Test-Path "dist\FileForge\FileForge.exe")) {
              Write-Error "FileForge.exe was not created."
              exit 1
          }
          if (!(Test-Path "dist\FileForge\_internal\version.json")) {
              Write-Error "version.json was not bundled."
              exit 1
          }

          Write-Host "=== Windows build ==="
          Get-ChildItem "dist\FileForge"

          $Size = (
              Get-ChildItem `
                  "dist\FileForge" `
                  -Recurse `
                  -File |
              Measure-Object Length -Sum
          ).Sum

          Write-Host "Build size: $([math]::Round($Size / 1MB, 2)) MB"

      # ==========================================
      # CREATE ZIP - LINUX
      # ==========================================

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          cd dist

          zip -r \
            ../FileForge-linux.zip \
            FileForge

          cd ..

          ls -lh FileForge-linux.zip

      # ==========================================
      # CREATE ZIP - WINDOWS
      # ==========================================

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\FileForge" `
            -DestinationPath "FileForge-windows.zip" `
            -Force

          Get-Item "FileForge-windows.zip"

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: FileForge-linux
          path: FileForge-linux.zip
          if-no-files-found: error

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FileForge-windows
          path: FileForge-windows.zip
          if-no-files-found: error

  # ==========================================
  # PUBLISH RELEASE
  # ==========================================

  release:
    name: Publish release

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # CHECKOUT (full history: release notes come from the commit log)
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================
      # DOWNLOAD BUILDS
      # ==========================================

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: FileForge-linux
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: FileForge-windows
          path: release

      # ==========================================
      # VERIFY RELEASE FILES
      # ==========================================

      - name: Verify release files
        shell: bash
        run: |
          set -e

          echo "=== Release files ==="
          ls -lh release

          test -f release/FileForge-linux.zip
          test -f release/FileForge-windows.zip

      # ==========================================
      # BUILD RELEASE NOTES (from the commit log)
      # ==========================================

      - name: Build release notes
        shell: bash
        run: |
          set -e

          tag="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${tag}"

          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' "${range}" 2>/dev/null || true
          } > release-notes.md

          echo "=== release-notes.md ==="
          cat release-notes.md

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/FileForge-linux.zip
            release/FileForge-windows.zip
          body_path: release-notes.md
